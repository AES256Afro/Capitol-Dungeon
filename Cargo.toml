[package]
name = "capitol-dungeon"
version = "0.1.0"
edition = "2021"
description = "A lo-fi pixel dungeon crawler about solidarity vs. vulture capital"
license = "MIT"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# note: no LTO — fat LTO strips the GL symbols miniquad imports from JS on wasm
[profile.release]
opt-level = "z"
